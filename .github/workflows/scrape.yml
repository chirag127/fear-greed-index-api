name: collect

on:
  schedule:
    - cron: '0 * * * *' # hourly — MMI moves intraday; daily series dedupe by date
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No dependency install: the collector runs on Node's native fetch.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Collect all sources
        run: node scripts/collect.mjs

      - name: Verify emitted API
        run: node scripts/verify.mjs

      - name: Enforce no git LFS
        run: node scripts/check-no-lfs.mjs

      - name: Commit + push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "no changes this run"
            exit 0
          fi
          git commit -m "data: collect $(date -u +%FT%H:%MZ)"
          git push
